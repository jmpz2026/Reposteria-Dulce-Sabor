<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Dulce Sabor</title>
    <link rel="stylesheet" href="css/global/sidebar.css">
    <link rel="stylesheet" href="css/global/mainhome.css">
    <link rel="stylesheet" href="css/checkout.css">

    <script src="./js/sidebar.js" defer></script>
    <script src="./js/checkout.js" defer></script>
    <script src="./js/bill.js" defer></script>
</head>
<body>
<div class="sidebar">
    <div class="homeSection" onclick="location.href='./main-page.html'" style="cursor: pointer;">
        <img src="./assets/images/sidebar/homeIcon.svg" alt="TIENDA">
        <p>TIENDA</p>
    </div>
    <div class="cartSection" onclick="location.href='./checkout.html'" style="cursor: pointer;">
        <img src="./assets/images/sidebar/cartIcon.svg" alt="CARRITO">
        <p>CARRITO</p>
    </div>
    <div class="contactUsSection" onclick="location.href='./info-us.html'" style="cursor: pointer;">
        <img src="./assets/images/sidebar/contactUsIcon.svg" alt="CONTACTO">
        <p>CONTACTANOS</p>
    </div>
</div>

<div class="mainHome">
    <div class="bill">
        <div class="summarySection">
            <p style="font-weight: bold; font-size: 1.2em; text-align: center;">Resumen del pedido</p>
            <hr>
            <div class="itemSection">
                <img id="resumen-foto" src="./assets/images/home/postre.jpg" alt="Producto">
                <div>
                    <p id="resumen-nombre" style="font-weight: bold;">Cargando producto...</p>
                    <p id="resumen-precio">$0</p>
                </div>
            </div>
            <hr>
            <div class="itemPrice">
                <div class="itemInline">
                    <p>Domicilio:</p>
                    <p>2000$</p>
                </div>
            </div>
            <hr>
            <div class="itemPriceTotal">
                <div class="itemInline">
                    <p>Total:</p>
                    <p id="resumen-total" style="font-weight: bold; color: #4a1d33;">$0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="detailSection">
        <p>Datos de pago</p>
        <form class="detailForm">
            <label for="name">Nombre:</label>
            <input type="text" id="name" name="name" placeholder="Ingrese el nombre de la persona" required>

            <label for="address">Direccion:</label>
            <input type="text" id="address" name="address" placeholder="Ingrese la direccion" required>

            <label for="phone">Numero de celular:</label>
            <input type="text" id="phone" name="phone" placeholder="Ingrese el numero de celular" required>

            <label for="email">Correo electronico:</label>
            <input type="text" id="email" name="email" placeholder="Ingrese el correo electronico" required>

            <label for="paymentOption">Elige una opción:</label>
            <select id="paymentOption">
                <option value="1">TARJETA</option>
                <option value="2">TRANSFERENCIA</option>
                <option value="3">EFECTIVO</option>
            </select>

            <input type="submit" value="Confirmar pago" class="btnSubmit">
        </form>
    </div>
</div>

<script src="./js/tienda.js"></script>
<script>
    // Esta línea hace que apenas se abra la página, se busquen los datos guardados
    window.onload = mostrarResumen;
</script>
</body>
</html>
